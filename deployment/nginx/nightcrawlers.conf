# /opt/nightcrawlers/nginx/nightcrawlers.conf  (mounted into the nginx container)
#
# Changes from the previous version, and why:
#   1. nginx now looks up the API container's address every 10s. Before, it
#      looked it up once at start-up; every deploy recreates the API container
#      with a NEW internal address, so nginx kept sending traffic to the old
#      one → "Could not reach the server" until nginx was restarted.
#   2. When the API is down/restarting (502/503/504) or a visitor is rate
#      limited (429), nginx answers with JSON *and CORS headers*. Before, those
#      replies had no CORS headers, so the browser hid them and the app could
#      only say "Could not reach the server".
#   3. Rate limit raised from 10 to 30 requests/second per IP. Nigerian mobile
#      networks put many customers behind one shared IP address, so a busy
#      evening could rate-limit everyone on the same network.
#   4. Domain is api.nightcrawlers.app (the old file said .com).

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Browsers that may read nginx's own error replies (same list as the API's CORS).
map $http_origin $cors_origin {
    default                                         "";
    "~^https://(www\.)?nightcrawlers\.app$"         $http_origin;
    "~^https://night-crawlers[a-z0-9-]*\.vercel\.app$" $http_origin;
}

# WebSocket upgrade only when the client asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# ── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.nightcrawlers.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.nightcrawlers.app;

    ssl_certificate     /etc/letsencrypt/live/api.nightcrawlers.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nightcrawlers.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    # Docker's internal DNS. Re-resolve the API container every 10 seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream http://nightcrawlers_api:5000;

    # nginx's own errors → JSON the app can read and show properly.
    error_page 502 503 504 =503 @api_unavailable;
    error_page 429 =429 @too_many;

    location / {
        limit_req zone=api burst=120 nodelay;
        limit_req_status 429;

        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 15m;
        proxy_intercept_errors off;   # the API's own errors pass through untouched
    }

    location = /health {
        access_log off;
        set $health_upstream http://nightcrawlers_api:5000/health;
        proxy_pass $health_upstream;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Retry-After 10 always;
        return 503 '{"message":"Nightcrawlers is restarting or busy. Please try again in a few seconds.","retryAfter":10}';
    }

    location @too_many {
        default_type application/json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Retry-After 5 always;
        return 429 '{"message":"Lots of people are ordering right now. Please try again in a moment.","retryAfter":5}';
    }
}
